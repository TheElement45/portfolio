<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <script>
        try {
            var scheme = localStorage.getItem('color-scheme');
            if (scheme === 'dark' || scheme === 'light') {
                document.querySelector('meta[name="color-scheme"]').content = scheme;
                document.documentElement.classList.add(scheme);
            }
        } catch (e) {}
    </script>
    <title>404 — Page Not Found | Element.dev</title>
    <link rel="icon" type="image/svg+xml" href="asset/favicon.svg">
    <link rel="apple-touch-icon" href="asset/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-200 antialiased min-h-screen flex items-center justify-center px-4">
    <main class="max-w-lg w-full text-center bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-2xl p-10 shadow-xl">
        <p class="text-sm font-bold tracking-wide text-blue-600 dark:text-blue-400 uppercase mb-2">Error 404</p>
        <h1 class="text-4xl font-bold text-slate-900 dark:text-white mb-4">Page not found</h1>
        <p class="text-slate-600 dark:text-slate-300 mb-8 leading-relaxed">
            The page you're looking for doesn't exist or has been moved.
        </p>
        <a href="./" class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors shadow-lg shadow-blue-500/30">
            <svg aria-hidden="true" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M19 12H5m7-7-7 7 7 7"/>
            </svg>
            Back to Portfolio
        </a>
    </main>
</body>
</html>
